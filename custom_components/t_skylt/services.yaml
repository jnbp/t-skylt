ticker_message:
  name: Send ticker message
  description: Shows a text in the ticker of a board running Departures Plus.
  fields:
    message:
      name: Message
      description: The text to show.
      required: true
      example: "Door opened"
      selector:
        text:
    duration:
      name: Duration
      description: Seconds the message stays in the ticker. 0 keeps it until it is cleared. Leave empty to use the board's "Ticker Message Duration" entity.
      required: false
      example: 120
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    message_id:
      name: Message ID
      description: A name for this message. Sending again with the same ID replaces it, and it can be cleared by this ID.
      required: false
      example: "door"
      selector:
        text:
    wake:
      name: Wake display
      description: Turn a switched-off display on for as long as the message runs. Leave empty to use the board's "Ticker Wake Display" switch.
      required: false
      selector:
        boolean:
    config_entry_id:
      name: Board
      description: Which board to use. Leave empty to send to every Departures Plus board.
      required: false
      selector:
        config_entry:
          integration: t_skylt
clear_ticker:
  name: Clear ticker messages
  description: Removes ticker messages from a board running Departures Plus. The permanent ticker text is not touched.
  fields:
    message_id:
      name: Message ID
      description: Clear only the message with this ID. Leave empty to clear all messages.
      required: false
      example: "door"
      selector:
        text:
    config_entry_id:
      name: Board
      description: Which board to use. Leave empty to clear on every Departures Plus board.
      required: false
      selector:
        config_entry:
          integration: t_skylt

set_icon:
  name: Set status icon
  description: Shows a symbol or up to two letters in one of the three icon places of the status row on a board running Departures Plus 0.9.0 or newer. An empty icon clears the place.
  fields:
    place:
      name: Place
      description: Icon place 1, 2 or 3.
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    icon:
      name: Icon
      description: A symbol name, or up to two letters. A leading / shows letters that are also a symbol name (/wc). Empty clears the place.
      required: false
      example: "wc"
      selector:
        select:
          custom_value: true
          options:
            - "wc"
            - "door"
            - "window"
            - "light"
            - "power"
            - "house"
            - "key"
            - "bell"
            - "washer"
            - "dishes"
            - "dryer"
            - "coffee"
            - "trash"
            - "water"
            - "battery"
            - "temp"
            - "heart"
            - "mail"
            - "sun"
            - "cloud"
            - "rain"
            - "snow"
            - "storm"
            - "moon"
            - "dot"
    color:
      name: Color
      description: Empty for the board's LED tone, or white, red, green, blue, yellow, orange or a hex color like #ff0000.
      required: false
      example: "red"
      selector:
        text:
    config_entry_id:
      name: Board
      description: Which board to use. Leave empty to set it on every Departures Plus board.
      required: false
      selector:
        config_entry:
          integration: t_skylt
