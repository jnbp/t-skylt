name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/t_skylt/manifest.json
      - .github/RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release for a new manifest version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/t_skylt/manifest.json)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi
          notes=.github/RELEASE_NOTES.md
          title=$(head -n 1 "$notes" | sed 's/^# *//')
          case "$title" in
            "$version"*) ;;
            *) echo "Release notes are not written for $version, skipping."; exit 0 ;;
          esac
          tail -n +2 "$notes" > "$RUNNER_TEMP/body.md"
          gh release create "$version" --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/body.md"
